## Python (pytest)
```python
import pytest
from unittest.mock import Mock, patch

class TestClassName:
    @pytest.fixture
    def instance(self):
        return ClassName()

    def test_happy_path(self, instance):
        result = instance.method("valid")
        assert result == expected

    def test_edge_empty(self, instance):
        assert instance.method([]) == []

    @pytest.mark.parametrize("input,expected", [
        ("valid", True),
        ("", False),
        (None, False),
    ])
    def test_various(self, input, expected):
        assert function(input) == expected
```

## TypeScript (Vitest)
