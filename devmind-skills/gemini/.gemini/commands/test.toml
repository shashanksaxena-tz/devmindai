  it('handles valid input', () => {
    expect(fn('valid')).toEqual(expected);
  });

  it.each([
    ['valid', true],
    ['', false],
  ])('returns %s for %s', (input, expected) => {
    expect(fn(input)).toBe(expected);
  });
});
```

